[project]
name = "data-analytics-portfolio"
version = "0.1.0"
description = "Reproducible operational analytics examples"
requires-python = ">=3.10"
dependencies = [
    "pandas==2.2.3",
    "openpyxl==3.1.5",
    "scipy==1.15.3",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
